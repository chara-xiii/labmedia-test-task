<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <title>Payment Dashboard</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body>
    <div class='container text-center mt-5'>
        <div class='mb-4'>
            <button id='toggleBtn' class='btn btn-primary' onclick='toggleChart()'>
                Показать гистограмму
            </button>
        </div>
        
        <div>
            <img id='lineChart' src="data:image/png;base64,{{ linear_graph }}" 
                 style='max-width: 100%; display: block; margin: 0 auto;'>
            <img id='barChart' src="data:image/png;base64,{{ histogram }}" 
                 style='max-width: 100%; display: none; margin: 0 auto;'>
        </div>
    </div>

    <script>
        let isLineChart = true;
        
        function toggleChart() {
            const lineChart = document.getElementById('lineChart');
            const barChart = document.getElementById('barChart');
            const button = document.getElementById('toggleBtn');
            
            if (isLineChart) {
                lineChart.style.display = 'none';
                barChart.style.display = 'block';
                button.textContent = 'Показать линейный график';
                isLineChart = false;
            } else {
                lineChart.style.display = 'block';
                barChart.style.display = 'none';
                button.textContent = 'Показать гистограмму';
                isLineChart = true;
            }
        }
    </script>
</body>
</html>
